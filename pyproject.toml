[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-fight"
dynamic = ["version"]
description = "A local two-player pixel-art fighting game."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame==2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
build = [
    "pyinstaller==6.21.0",
]

[project.scripts]
pixel-fight = "pixel_fight.__main__:main"

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
